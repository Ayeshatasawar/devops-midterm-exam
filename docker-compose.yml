version: '3.8'

services:
  web:
    build: .
    image: ayesha077/devops-midterm-app:v1
    ports:
      - "8021:80"   # SAP ID 55421 
    environment:
      - USER_NAME=ayesha077_exam
    volumes:
      - app-data:/app/data
    networks:
      - exam-net

  cache:
    image: redis:alpine
    networks:
      - exam-net

volumes:
  app-data:

networks:
  exam-net:
    driver: bridge